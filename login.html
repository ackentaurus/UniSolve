<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | UniSolve</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="adminlte/css/adminlte.min.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page bg-body-secondary">
    <main class="login-box">
        <h1 class="login-logo"><a href="login.html"><i class="bi bi-shield-check text-primary"></i> <b>Uni</b>Solve</a></h1>
        <div class="card">
            <div class="card-body login-card-body">
                <p class="login-box-msg">Inicia sesión para reportar y seguir incidencias del campus</p>
                <form id="formLogin">
                    <label class="visually-hidden" for="usuario">Usuario</label>
                    <div class="input-group mb-3">
                        <input type="text" id="usuario" class="form-control" placeholder="Usuario" autocomplete="username" required>
                        <div class="input-group-text"><span class="bi bi-person"></span></div>
                    </div>
                    <label class="visually-hidden" for="clave">Contraseña</label>
                    <div class="input-group mb-3">
                        <input type="password" id="clave" class="form-control" placeholder="Contraseña" autocomplete="current-password" required>
                        <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
                    </div>
                    <div id="error" class="alert alert-danger" hidden></div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Ingresar</button>
                    </div>
                </form>
                <p class="mt-3 mb-1 text-center">¿No tienes cuenta? <a href="singin.html">Regístrate</a></p>
                <p class="ayuda text-center text-secondary mb-0">Prueba: estudiante / docente / admin / area · clave 1234</p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="adminlte/js/adminlte.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
