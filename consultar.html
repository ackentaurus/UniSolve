<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar incidencias | UniSolve</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="adminlte/css/adminlte.min.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/consultar.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body" id="appHeader"></nav>
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" id="appSidebar"></aside>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6">
                            <h1 class="mb-0 fs-3">Incidencias</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-end">
                                <li class="breadcrumb-item"><a href="consultar.html">Inicio</a></li>
                                <li class="breadcrumb-item active" aria-current="page">Incidencias</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <div class="app-content">
                <div class="container-fluid">
                    <div class="row" id="resumen"></div>
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Incidencias registradas <span class="badge text-bg-light border ms-1" id="contador"></span></h3>
                            <div class="card-tools">
                                <a class="btn btn-primary btn-sm" href="registrarIncidencia.html"><i class="bi bi-plus-lg me-1"></i>Nueva incidencia</a>
                            </div>
                        </div>
                        <div class="card-body">
                            <p class="text-secondary" id="subtitulo"></p>
                            <div class="row g-2 mb-3">
                                <div class="col-lg"><input type="text" id="buscar" class="form-control" placeholder="Buscar por título o descripción..."></div>
                                <div class="col-md-6 col-lg"><select id="filtroEstado" class="form-select"></select></div>
                                <div class="col-md-6 col-lg"><select id="filtroCategoria" class="form-select"></select></div>
                                <div class="col-md-6 col-lg" id="colArea" hidden><select id="filtroArea" class="form-select"></select></div>
                                <div class="col-md-6 col-lg" id="colOrigen" hidden><select id="filtroOrigen" class="form-select"></select></div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle" id="tablaIncidencias">
                                    <thead>
                                        <tr><th>ID</th><th>Incidencia</th><th>Categoría</th><th>Ubicación</th><th>Fecha</th><th class="col-autor">Registrado por</th><th>Área</th><th>Prioridad</th><th>Estado</th><th></th></tr>
                                    </thead>
                                    <tbody id="tabla"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="float-end d-none d-sm-inline">Desarrollo Web Full Stack · Ciclo IV</div>
            <strong>UniSolve</strong> · Universidad Nacional de Cañete · 2026
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="adminlte/js/adminlte.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/consultar.js"></script>
</body>
</html>
