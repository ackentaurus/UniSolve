<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar incidencia | UniSolve</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="adminlte/css/adminlte.min.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/editar.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
    <div class="app-wrapper">
        <nav class="app-header navbar navbar-expand bg-body" id="appHeader"></nav>
        <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark" id="appSidebar"></aside>

        <main class="app-main">
            <div class="app-content-header">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6">
                            <h1 class="mb-0 fs-3">Editar incidencia</h1>
                        </div>
                        <div class="col-sm-6">
                            <ol class="breadcrumb float-sm-end">
                                <li class="breadcrumb-item"><a href="consultar.html">Inicio</a></li>
                                <li class="breadcrumb-item"><a href="consultar.html">Incidencias</a></li><li class="breadcrumb-item active" aria-current="page">Editar</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
            <div class="app-content">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-lg-8">
                            <form class="card card-primary card-outline needs-validation" id="formEditar" novalidate>
                                <div class="card-header"><h3 class="card-title" id="encabezado">Editar incidencia</h3></div>
                                <div class="card-body">
                                    <div id="mensaje" class="alert" hidden></div>

                                    <label for="titulo" class="form-label">Título</label>
                                    <input type="text" id="titulo" class="disable-adminlte-validations form-control" maxlength="80" required>
                                    <div class="invalid-feedback">Escribe un título para la incidencia.</div>

                                    <div class="row">
                                        <div class="col-md-6">
                                            <label for="categoria" class="form-label mt-3">Categoría</label>
                                            <select id="categoria" class="disable-adminlte-validations form-select" required></select>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="ubicacion" class="form-label mt-3">Ubicación</label>
                                            <input type="text" id="ubicacion" class="disable-adminlte-validations form-control" required>
                                            <div class="invalid-feedback">Indica dónde ocurrió la incidencia.</div>
                                        </div>
                                    </div>

                                    <label for="descripcion" class="form-label mt-3">Descripción</label>
                                    <textarea id="descripcion" class="disable-adminlte-validations form-control" rows="4" required></textarea>
                                    <div class="invalid-feedback">Describe el problema.</div>

                            <label for="foto" class="form-label mt-3">Fotografía de evidencia <span class="text-secondary">(opcional, puedes cambiarla o quitarla)</span></label>
                            <input type="file" id="foto" class="disable-adminlte-validations form-control" accept="image/*">
                            <div class="text-danger small" id="errorFoto"></div>
                            <img id="vistaPrevia" class="vista-previa img-fluid rounded border mt-2" alt="Vista previa de la fotografía" hidden>
                            <div><button type="button" id="btnQuitarFoto" class="btn btn-sm btn-outline-danger mt-2" hidden><i class="bi bi-x-lg me-1"></i>Quitar fotografía</button></div>
                                </div>
                                <div class="card-footer">
                                    <button class="btn btn-primary" type="submit"><i class="bi bi-save me-1"></i>Guardar cambios</button>
                                    <a class="btn btn-secondary" id="btnVolver" href="consultar.html">Volver</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <div class="float-end d-none d-sm-inline">Desarrollo Web Full Stack · Ciclo IV</div>
            <strong>UniSolve</strong> · Universidad Nacional de Cañete · 2026
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="adminlte/js/adminlte.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/editar.js"></script>
</body>
</html>
