<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | UniSolve</title>
    <script src="js/tema.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="adminlte/css/adminlte.min.css">
    <link rel="stylesheet" href="css/comun.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="register-page bg-body-secondary">
    <main class="register-box">
        <h1 class="login-logo"><a href="login.html"><i class="bi bi-shield-check text-primary"></i> <b>Uni</b>Solve</a></h1>
        <div class="card">
            <div class="card-body register-card-body">
                <p class="login-box-msg">Crea tu cuenta para registrar incidencias</p>
                <form id="formRegistro" class="needs-validation" novalidate>
                    <label class="visually-hidden" for="nombre">Nombre completo</label>
                    <div class="input-group mb-3">
                        <input type="text" id="nombre" class="disable-adminlte-validations form-control" placeholder="Nombre completo" maxlength="60" required>
                        <div class="input-group-text"><span class="bi bi-person-vcard"></span></div>
                        <div class="invalid-feedback">Ingresa tu nombre completo.</div>
                    </div>
                    <label class="visually-hidden" for="usuario">Usuario</label>
                    <div class="input-group mb-3">
                        <input type="text" id="usuario" class="disable-adminlte-validations form-control" placeholder="Usuario (3 a 20 caracteres)" maxlength="20" autocomplete="username" required>
                        <div class="input-group-text"><span class="bi bi-person"></span></div>
                        <div class="invalid-feedback">Ingresa un usuario.</div>
                    </div>
                    <label class="visually-hidden" for="rol">Tipo de usuario</label>
                    <div class="input-group mb-3">
                        <select id="rol" class="disable-adminlte-validations form-select" required>
                            <option>Estudiante</option>
                            <option>Docente/Personal</option>
                        </select>
                        <div class="input-group-text"><span class="bi bi-mortarboard"></span></div>
                    </div>
                    <label class="visually-hidden" for="clave">Contraseña</label>
                    <div class="input-group mb-3">
                        <input type="password" id="clave" class="disable-adminlte-validations form-control" placeholder="Contraseña (mínimo 4 caracteres)" autocomplete="new-password" required>
                        <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
                        <div class="invalid-feedback">Ingresa una contraseña.</div>
                    </div>
                    <label class="visually-hidden" for="clave2">Repetir contraseña</label>
                    <div class="input-group mb-3">
                        <input type="password" id="clave2" class="disable-adminlte-validations form-control" placeholder="Repite la contraseña" autocomplete="new-password" required>
                        <div class="input-group-text"><span class="bi bi-lock"></span></div>
                        <div class="invalid-feedback">Repite la contraseña.</div>
                    </div>
                    <div id="error" class="alert alert-danger" hidden></div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Crear cuenta</button>
                    </div>
                </form>
                <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
    <script src="adminlte/js/adminlte.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/registro.js"></script>
</body>
</html>
